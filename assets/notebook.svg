<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <rect width="1200" height="400" fill="#f7f3ec"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1d1a16">
    <text x="80" y="92" font-size="15" letter-spacing="1" fill="#6b6259" font-style="italic">An open notebook</text>
    <line x1="80" y1="112" x2="660" y2="112" stroke="#1d1a16" stroke-width="1"/>
    <text x="78" y="196" font-size="64">claude-memory-kit</text>
    <text x="80" y="250" font-size="25" font-style="italic" fill="#3d3731">The assistant I built for myself,</text>
    <text x="80" y="284" font-size="25" font-style="italic" fill="#3d3731">because I was tired of repeating myself.</text>
    <line x1="80" y1="318" x2="660" y2="318" stroke="#1d1a16" stroke-width="0.6"/>
    <text x="80" y="346" font-size="15" fill="#6b6259">Made by a marketer, not a developer. Plain notes, a nightly review, a few guardrails.</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1d1a16" font-style="italic">
    <circle cx="920" cy="200" r="112" fill="none" stroke="#1d1a16" stroke-width="1"/>
    <g fill="none" stroke="#1d1a16" stroke-width="1.2">
      <path d="M989.8 118.8 L999 121 L996.8 111.8"/>
      <path d="M1008.2 276.8 L999 279 L1001.2 269.8"/>
      <path d="M850.2 281.2 L841 279 L843.2 288.2"/>
      <path d="M831.8 123.2 L841 121 L838.8 130.2"/>
    </g>
    <circle cx="920" cy="88" r="4" fill="#b4532a"/>
    <circle cx="1032" cy="200" r="3.5" fill="#1d1a16"/>
    <circle cx="920" cy="312" r="3.5" fill="#1d1a16"/>
    <circle cx="808" cy="200" r="3.5" fill="#1d1a16"/>
    <text x="920" y="72" text-anchor="middle">I correct it</text>
    <text x="1044" y="205">it writes the rule</text>
    <text x="920" y="338" text-anchor="middle">at night, it reviews the day</text>
    <text x="796" y="196" text-anchor="end">morning:</text>
    <text x="796" y="216" text-anchor="end">a bit better</text>
    <text x="920" y="196" text-anchor="middle" font-size="13" fill="#6b6259">every day,</text>
    <text x="920" y="214" text-anchor="middle" font-size="13" fill="#6b6259">a little less to repeat</text>
  </g>
</svg>
