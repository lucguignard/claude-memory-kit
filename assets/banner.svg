<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1712"/><stop offset="1" stop-color="#2b2118"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <text x="70" y="128" fill="#f4ede4" font-size="58" font-weight="700">claude-memory-kit</text>
  <text x="72" y="182" fill="#e0a578" font-size="27">An assistant that learns from you every night.</text>
  <text x="72" y="222" fill="#a89a8c" font-size="20">Plain Markdown memory in git · nightly self-audit · morning tool radar · guardrails</text>
  <g font-size="17" fill="#f4ede4">
    <rect x="70" y="262" width="230" height="46" rx="23" fill="#3a2d22" stroke="#d97757"/>
    <text x="185" y="291" text-anchor="middle">You correct it once</text>
    <text x="322" y="291" fill="#d97757" font-size="22">→</text>
    <rect x="352" y="262" width="230" height="46" rx="23" fill="#3a2d22" stroke="#d97757"/>
    <text x="467" y="291" text-anchor="middle">It writes the rule</text>
    <text x="604" y="291" fill="#d97757" font-size="22">→</text>
    <rect x="634" y="262" width="230" height="46" rx="23" fill="#3a2d22" stroke="#d97757"/>
    <text x="749" y="291" text-anchor="middle">Night: it reviews itself</text>
    <text x="886" y="291" fill="#d97757" font-size="22">→</text>
    <rect x="916" y="262" width="214" height="46" rx="23" fill="#d97757"/>
    <text x="1023" y="291" text-anchor="middle" fill="#1b1712" font-weight="600">Morning: sharper</text>
  </g>
</svg>
